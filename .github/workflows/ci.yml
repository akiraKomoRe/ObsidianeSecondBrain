name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No environment variables are set on purpose: the app has to build and
      # its tests have to pass without a Supabase project or an Anthropic key,
      # which is what the local mode in src/lib/local/ exists to guarantee.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
